name: Sync Client Repository

on:
  push:
    branches:
      - Master

jobs:
  sync-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.CLIENT_REPO_SSH_KEY }}" > ~/.ssh/client_repo_key
          chmod 600 ~/.ssh/client_repo_key

          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config <<EOF
          Host github-client
            HostName github.com
            User git
            IdentityFile ~/.ssh/client_repo_key
            IdentitiesOnly yes
          EOF

      - name: Sync main branch to client repository
        run: |
          git remote add client git@github-client:itcosmopolitan/cosmopolitan_billing_web.git
          git push client Master:main
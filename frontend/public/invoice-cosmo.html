<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Invoice</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    color: #222;
    margin: 0;
    padding: 0;
    background: #e8e8e8;
  }
  .page {
    width: 850px;
    background: #fff;
    margin: 20px auto;
    padding: 30px 40px 20px 40px;
    position: relative;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .page:last-child {
    page-break-after: auto;
  }
  table.items {
    page-break-inside: auto;
  }
  table.items thead, table.items tbody, table.items tbody tr {
    page-break-inside: avoid;
  }
  /* Header */
  .header {
    display: grid;
    grid-template-columns: 180px 1fr 120px;
    align-items: flex-start;
    border-bottom: 0px solid transparent;
    padding-bottom: 6px;
    gap: 16px;
  }
  .logo-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 180px;
  }
  .logo-img {
    width: 150px;
    height: auto;
    display: block;
  }
  .logo-tag {
    font-size: 10px;
    font-style: italic;
    color: #444;
  }
  .fssc {
    font-size: 10px;
    color: #2e7d32;
    font-weight: bold;
    margin-top: 6px;
  }
  .company-info {
    flex: 1;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }
  .company-name {
    color: #6dbe4b;
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 4px;
    white-space: nowrap;
    line-height: 1.2;
  }
  .company-line {
    font-size: 12px;
    color: #222;
    line-height: 1.4;
    white-space: pre;
    overflow-x: visible;
  }
  .company-addr {
    display: none;
  }
  .gold-badge {
    text-align: center;
    width: 120px;
    display:flex;justify-content:flex-end;align-items:center
  }
  .badge-img {
    width: 86px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .gold-circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe27a, #d4af37);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: bold;
    color: #5a4200;
    margin: 0 auto 2px auto;
  }
  .gold-seal {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    border: 3px solid #c89b43;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #8b6a00;
    text-align: center;
    padding: 4px;
    margin: 0 auto;
  }
  .gold-seal .gold-corporate { font-size: 9px; letter-spacing: 0.6px; color: #8b6a00; margin-bottom: 0; }
  .gold-seal .gold-text { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .gold-seal .gold-100 { font-size: 26px; font-weight: 800; line-height: 0.95; margin-top: 0; }
  .gold-seal .gold-year { font-size: 10px; margin-top: 2px; color: #6d6d6d }

  /* Title */
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-top: 6px;
    position: relative;
  }
  .copy-label {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #fff;
    background: #1b3e6f;
    padding: 3px 7px;
    border-radius: 4px;
    margin-bottom: 4px;
  }
  .title-row h1 {
    font-size: 16px;
    margin: 0;
    color: #111;
    letter-spacing: 0.4px;
    font-weight: 800;
  }
  .title-row .pageno {
    font-size: 9.5px;
    color: #555;
    white-space: nowrap;
  }

  /* Bill-to / seller block */
  .parties {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 22px;
    margin-top: 18px;
    align-items: start;
  }
  .bill-to {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .bill-to h2 {
    font-size: 15px;
    margin: 0 0 6px 0;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.2;
  }
  .bill-to .addr-line {
    font-size: 10.5px;
    line-height: 1.35;
    color: #222;
    white-space: pre-wrap;
    margin-top: 2px;
  }
  .seller-addr {
    font-size: 10.5px;
    text-align: right;
    line-height: 1.35;
    color: #222;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .seller-addr strong {
    display: block;
    font-weight: 700;
    margin-bottom: 4px;
  }

  /* Info table */
  .info-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .details-box {
    border: 1px solid rgba(0,0,0,0.08);
    padding: 10px 12px;
    border-radius: 6px;
    background: #fbfbfb;
  }
  .details-title {
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #1b3e6f;
  }
  .info-left table, .info-right table {
    border-collapse: collapse;
    font-size: 10px;
    width: 100%;
  }
  .info-left td, .info-right td {
    padding: 2px 3px;
    vertical-align: top;
    line-height: 1.25;
  }
  .info-left td.label, .info-right td.label {
    color: #333;
    white-space: nowrap;
    width: 130px;
    font-weight: 700;
    font-size: 9.8px;
    letter-spacing: 0.3px;
  }
  .info-left td + td, .info-right td + td {
    padding-left: 8px;
    color: #111;
    font-size: 10px;
  }
  .info-left tr, .info-right tr {
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .info-left tr:last-child td, .info-right tr:last-child td {
    border-bottom: none;
  }
  .info-left td, .info-right td {
    padding-top: 3px;
    padding-bottom: 3px;
  }
  .info-right {
    text-align: left;
  }

  /* Items table */
  table.items {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 10.5px;
  }
  table.items thead tr {
    border-top: 1.5px solid #1b3e6f;
    border-bottom: 1.5px solid #1b3e6f;
  }
  table.items th {
    text-align: left;
    padding: 5px 4px;
    font-weight: bold;
    color: #1b3e6f;
  }
  table.items td {
    padding: 4px 4px;
    vertical-align: top;
  }
  table.items th.num, table.items td.num {
    text-align: right;
  }
  table.items tbody tr {
    border-bottom: 1px solid #eee;
  }

  .totals {
    width: 100%;
    margin-top: 4px;
  }
  .totals td {
    padding: 3px 4px;
    font-size: 10.5px;
  }
  .totals .tlabel {
    text-align: right;
    padding-right: 10px;
  }
  .totals .tval {
    text-align: right;
    width: 110px;
  }
  .totals .grand {
    border-top: 1.5px solid #1b3e6f;
    font-weight: bold;
  }

  .amount-words {
    margin-top: 10px;
    font-size: 10.5px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  .payment-section {
    margin-top: 22px;
    border-top: 1px solid #333;
    padding-top: 10px;
    font-size: 10.5px;
  }
  .payment-row {
    display: flex;
    margin-bottom: 4px;
  }
  .payment-row .plabel {
    width: 160px;
    flex-shrink: 0;
  }
  .payment-row .pcolon {
    width: 12px;
  }
  .bank-details {
    margin-left: 172px;
    line-height: 1.5;
  }

  .terms {
    margin-top: 16px;
    font-size: 9.5px;
    color: #333;
    line-height: 1.6;
  }
  .terms div { margin-bottom: 1px; }

  .thankyou {
    margin-top: 24px;
    text-align: center;
    font-style: italic;
    font-weight: bold;
    font-size: 11px;
  }

  .signoff {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    font-size: 10.5px;
    font-weight: bold;
  }

  .page-break {
    page-break-before: always;
  }

  .p2-note {
    margin-top: 20px;
    font-size: 11px;
    font-weight: bold;
  }

  @media print {
    body { background: #fff; }
    .page { box-shadow: none; margin: 0; width: auto; }
  }
</style>
</head>
<body>
<div id="invoicePages"></div>
<script>
(function(){
  function formatNumber(value, opts = {}) {
    const n = Number(value || 0)
    if (Number.isNaN(n)) return '0.00'
    return n.toLocaleString('en-MV', {
      minimumFractionDigits: opts.minimumFractionDigits ?? 2,
      maximumFractionDigits: opts.maximumFractionDigits ?? 2,
    })
  }

  function formatDate(value) {
    if (!value) return ''
    const date = new Date(value)
    if (Number.isNaN(date)) return value

    const year = date.getFullYear()
    const month = String(date.getMonth() + 1).padStart(2, '0')
    const day = String(date.getDate()).padStart(2, '0')
    const hours = String(date.getHours()).padStart(2, '0')
    const minutes = String(date.getMinutes()).padStart(2, '0')
    const seconds = String(date.getSeconds()).padStart(2, '0')

    return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`
  }

  function escapeHtml(value) {
    return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  }

  function renderRows(items) {
    return items.map((it, index) => {
      const qty = Number(it.qty || it.quantity || 0)
      const rate = Number(it.price || it.rate || 0)
      const discountPct = Number(it.discount ?? it.discPercent ?? it.disc_percent ?? it.discount_pct ?? 0)
      const gstRate = Number(it.taxRate ?? it.tax_rate ?? 0)
      const amount = Number(it.lineTotal || it.total || qty * rate)
      const gstAmt = Math.round((amount * gstRate) / 100 * 100) / 100
      const sku = it.sku || ''
      return `<tr>\n<td>${escapeHtml(sku)}</td>\n<td>${escapeHtml(it.name || it.description || '')}</td>\n<td>${escapeHtml(it.packing || it.package || '')}</td>\n<td>${escapeHtml(it.origin || it.country || '')}</td>\n<td>${escapeHtml(it.units || it.unit || '')}</td>\n<td class="num">${formatNumber(qty,{minimumFractionDigits:0,maximumFractionDigits:3})}</td>\n<td class="num">${formatNumber(rate)}</td>\n<td class="num">${discountPct ? formatNumber(discountPct, {minimumFractionDigits:0,maximumFractionDigits:2}) + '%' : ''}</td>\n<td class="num">${formatNumber(gstAmt)}</td>\n<td class="num">${formatNumber(amount)}</td>\n</tr>`
    }).join('\n')
  }

  function renderPage(pageIndex, totalPages, pageItems, invoice, branch, totals, copyLabel) {
    return `
      <div class="page">
        <div class="header">
          <div style="display:flex; align-items:flex-start;">
            <div class="logo-block">
              <img class="logo-img" src="${escapeHtml(branch.logo || branch.logo_url || '/assets/cosmopolitan-logo.png')}" alt="Cosmopolitan" />
              <div class="logo-tag">"where quality and service matters"</div>
              <div class="fssc">&#9678; FSSC 22000</div>
            </div>
          </div>
          <div class="company-info">
            <div class="company-name">${escapeHtml(branch.company || 'Cosmopolitan Champa Brothers Maldives Pvt Ltd')}</div>
            <div class="company-line">${escapeHtml(('LOT NO-10627, Haivakaru Magu,  T : 960 331 0477  E : info@cosmopolitan.com.mv').split('\n')[0])}</div>
            <div class="company-line">${escapeHtml(('LOT NO-10627, Haivakaru Magu,  T : 960 331 0477  E : info@cosmopolitan.com.mv').split('\n')[1] || 'Hulhumale\', Republic of Maldives,  F : 960 331 0458  W : www.cosmopolitan.com.mv')}</div>
          </div>
          <div class="gold-badge">
            ${branch.badge || branch.badge_url || branch.badgeImage || branch.badgeUrl ? `<img class="badge-img" src="${escapeHtml(branch.badge || branch.badge_url || branch.badgeImage || branch.badgeUrl)}" alt="Badge" />` : `
                <img id="goldSealImg" class="badge-img" src="/assets/gold-100-seal.png" alt="Gold 100 seal" onerror="this.style.display='none';document.getElementById('goldSealFallback').style.display='block'" />
                <div id="goldSealFallback" class="gold-seal" role="img" aria-label="Gold 100 seal" style="display:none;">
                  <div class="gold-corporate">Corporate Maldives</div>
                  <div class="gold-text">GOLD</div>
                  <div class="gold-100">100</div>
                  <div class="gold-year">2023</div>
                </div>
            `}
          </div>
        </div>

        <div class="title-row">
          ${copyLabel ? `<div class="copy-label">${escapeHtml(copyLabel)}</div>` : ''}
          <h1 class='center'>Sales Invoice</h1>
          <div class="pageno">Page ${pageIndex + 1} of ${totalPages}</div>
        </div>

        <div class="parties">
          <div class="bill-to details-box">
            <div class="details-title">Customer Details</div>
            <h2 style="margin:0 0 6px 0;">${escapeHtml(invoice.customerName || invoice.customer_name || invoice.customer || invoice.name || '')}</h2>
            <div class="addr-line">${(() => {
              // Put street1/street2/street3 on the same line, then other parts on subsequent lines
              const streetParts = [
                invoice.customerStreet1 || invoice.customer_street1,
                invoice.customerStreet2 || invoice.customer_street2,
                invoice.customerStreet3 || invoice.customer_street3,
              ].filter((p) => typeof p === 'string' && p.trim()).map((p) => p.trim())

              const otherParts = [
                invoice.customerCity || invoice.customer_city || invoice.city,
                invoice.customerStateProvince || invoice.customer_state_province,
                invoice.customerCountry || invoice.customer_country || invoice.country,
                invoice.customerPostalCode || invoice.customer_postal_code || invoice.postal_code,
              ].filter((p) => typeof p === 'string' && p.trim()).map((p) => p.trim())

              const addressLines = []
              if (streetParts.length) addressLines.push(streetParts.join(', '))
              if (otherParts.length) addressLines.push(...otherParts)

              if (!addressLines.length) {
                const rawAddress = invoice.customerAddress || invoice.customer_address || invoice.address || invoice.shippingAddress || invoice.address_lines || invoice.addressLines || ''
                if (Array.isArray(rawAddress)) {
                  addressLines.push(...rawAddress.filter(Boolean).map((line) => String(line).trim()))
                } else if (rawAddress) {
                  addressLines.push(...String(rawAddress).split('\n').map((line) => line.trim()).filter(Boolean))
                }
              }
              return escapeHtml(addressLines.join('\n')).replace(/\n/g,'<br/>')
            })()}</div>
            <table style="margin-top:10px; width:100%;">
              ${(() => {
                const customerCode = invoice.customerCode || invoice.customer_code || ''
                const customerGstin = invoice.customerGstin || invoice.customer_gstin || invoice.customerGSTIN || invoice.customer_gst_in || invoice.gstin || invoice.gstNo || invoice.gst_no || ''
                const customerName = (invoice.customerName || invoice.customer_name || invoice.customer || invoice.name || '').toString().trim().toLowerCase()
                const isWalkIn = customerName === 'walkin' || customerName === 'walk-in' || customerName === 'walk in' || customerName === 'walkin customer' || customerName === 'cash customer'
                return customerCode && !isWalkIn ? `<tr><td class="label">Bill-to Customer No.</td><td>${escapeHtml(customerCode)}</td></tr>` : ''
              })()}
              ${(() => {
                const customerGstin = invoice.customerGstin || invoice.customer_gstin || invoice.customerGSTIN || invoice.customer_gst_in || invoice.gstin || invoice.gstNo || invoice.gst_no || ''
                const customerName = (invoice.customerName || invoice.customer_name || invoice.customer || invoice.name || '').toString().trim().toLowerCase()
                const isWalkIn = customerName === 'walkin' || customerName === 'walk-in' || customerName === 'walk in' || customerName === 'walkin customer' || customerName === 'cash customer'
                return customerGstin && !isWalkIn ? `<tr><td class="label">Customer GST IN</td><td>${escapeHtml(customerGstin)}</td></tr>` : ''
              })()}
              <tr><td class="label">Invoice No.</td><td>${escapeHtml(invoice.number || invoice.invoiceNumber || invoice.invoice_no || '')}</td></tr>
              <tr><td class="label">Posting Date</td><td>${formatDate(invoice.date || invoice.invoiceDate || invoice.invoice_date)}</td></tr>
            </table>
          </div>
          <div class="seller-addr details-box">
            <div class="details-title">Branch Details</div>
            <div style="font-weight:700; margin-bottom:6px;">${escapeHtml('Cosmopolitan Champa Brothers Maldives Pvt Ltd')}</div>
            <div style="margin-bottom:8px;">${escapeHtml(branch.address || branch.address_lines || branch.addressLines || 'LOT NO-10627, Haivakaru Magu, Hulhumale\', Maldives.').replace(/\n/g,'<br/>')}</div>
            <table style="width:100%;">
              <tr><td class="label">Phone No.</td><td>${escapeHtml(branch.phone || branch.tel || branch.phoneNo || branch.phone_no || '')}</td></tr>
              <tr><td class="label">Branch E-Mail</td><td>${escapeHtml(invoice.email || branch.email || branch.emailAddress || branch.email_address || '')}</td></tr>
              <tr><td class="label">Website</td><td>${escapeHtml(invoice.website || branch.homePage || branch.url || branch.website || '')}</td></tr>
              <tr><td class="label">GST Reg no</td><td>${escapeHtml(branch.gst || branch.gstNo || branch.gstin || branch.gst_no || '')}</td></tr>
              <tr><td class="label">Salesperson</td><td>${escapeHtml(invoice.salesperson || invoice.salesPerson || invoice.salesperson_name || '')}</td></tr>
            </table>
          </div>
        </div>

        <table class="items">
          <thead>
            <tr>
              <th>Product ID</th>
              <th>Description</th>
              <th>Packing</th>
              <th>Origin</th>
              <th>Units</th>
              <th class="num">Qty</th>
              <th class="num">Rate</th>
              <th class="num">Disc %</th>
              <th class="num">GST</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${renderRows(pageItems)}
          </tbody>
        </table>

        ${pageIndex === totalPages - 1 ? `
          <table class="totals">
            <tr>
              <td colspan="6"></td>
              <td class="tlabel">Total MRF Excl. GST</td>
              <td class="tval">${formatNumber(totals.subtotal)}</td>
            </tr>
            ${totals.discountAmount ? `
            <tr>
              <td colspan="6"></td>
              <td class="tlabel">Discount (${totals.discountPercent}%)</td>
              <td class="tval">-${formatNumber(totals.discountAmount)}</td>
            </tr>
            ` : ''}
            <tr>
              <td colspan="6"></td>
              <td class="tlabel">${escapeHtml(totals.taxLabel)}</td>
              <td class="tval">${formatNumber(totals.taxTotal)}</td>
            </tr>
            <tr>
              <td colspan="6"></td>
              <td class="tlabel grand">Total MRF Incl. GST</td>
              <td class="tval grand">${formatNumber(totals.total)}</td>
            </tr>
          </table>
          <div class="amount-words">${escapeHtml(totals.totalInWords)}</div>
          <div class="payment-section">
            <div class="payment-row">
              <div class="plabel">Payment Due Date</div><div class="pcolon">:</div><div>${formatDate(invoice.dueDate || invoice.due_date)}</div>
            </div>
            <div class="payment-row">
              <div class="plabel">Terms &amp; Conditions</div><div class="pcolon">:</div>
              <div>30DAYS &nbsp; from date of invoice to our account as follows:</div>
            </div>
            <div class="bank-details">
              A/C NAME : Cosmopolitan Champa Brothers Maldives Pvt Ltd<br>
              Bank Account No : 7730000519444<br>
              Bank Name : Bank of Maldives<br>
              Bank Address : Boduthakurufaanu Magu, Malé 20094<br>
              Swift Code : MALBMVMVXXX
            </div>
          </div>
          <div class="terms">
            <div>- Cosmopolitan (Champa Bros. Maldives Pvt Ltd) cannot take any responsibility for product lost or spoil in transit</div>
            <div>- Overdue outstanding will be subject to 1% interest per overdue day.</div>
            <div>- Any invoice discrepancies should be made clear via e-mail/fax no later than 24 hours after receiving.</div>
            <div>- In case of currency fluctuations, invoices must be settled by the latest maximum legal rate as advised by the MMA.</div>
            <div>- By accepting COSMOPOLITAN and/or other products described in the Invoice, the customer accepts these terms and conditions</div>
            <div>- The above document is governed by and enforced in accordance with the laws and regulations of the Republic of Maldives.</div>
          </div>
          <div class="thankyou">Thank you for choosing Cosmopolitan as your preferred partner</div>
          <div class="signoff">
            <div>Recieved By</div>
          </div>
        ` : ''}
      </div>
    `
  }

  function paginateItems(items, rowsPerPage) {
    const pages = []
    for (let i = 0; i < items.length; i += rowsPerPage) {
      pages.push(items.slice(i, i + rowsPerPage))
    }
    return pages
  }

  let hasRenderedInvoice = false

  function normalizeInvoicePayload(payload) {
    const sale = { ...(payload?.sale || {}) }
    const sourceBranch = payload?.branch || {}
    const organisation = sale.organisation || sale.organization || {}
    const branch = { ...organisation, ...sourceBranch }

    const phone = sale.phoneNo || sale.phone_no ||
      branch.phone || branch.tel || branch.phoneNo || branch.phone_no ||
      organisation.phone || ''
    const email = sale.email ||
      branch.email || branch.emailAddress || branch.email_address ||
      organisation.email || ''
    const website = sale.website || sale.homePage || sale.homepage ||
      branch.website || branch.homePage || branch.homepage || branch.url ||
      organisation.website || organisation.homePage || ''
    const branchGst = sourceBranch.gstRegNo || sourceBranch.gst || sourceBranch.gstin ||
      sourceBranch.gstNo || sourceBranch.gst_no || organisation.gstin ||
      organisation.gstNo || organisation.gst_no || ''
    const salesperson = sale.salesperson || sale.salesPerson ||
      sale.salesperson_name || sale.cashier || sale.cashierName || ''

    Object.assign(branch, {
      company: sourceBranch.company || sourceBranch.companyName || '',
      address: sourceBranch.address || sourceBranch.address_lines || sourceBranch.addressLines || '',
      phone,
      phoneNo: branch.phoneNo || phone,
      website,
      homePage: branch.homePage || website,
      gstin: branchGst,
      gst: branchGst,
      gstNo: branchGst,
      gst_no: branchGst,
      email,
    })

    Object.assign(sale, {
      salesperson,
      phoneNo: phone,
      email,
      website,
    })

    return { ...payload, sale, branch }
  }

  function renderInvoicePayload(payload) {
    if (hasRenderedInvoice) return
    hasRenderedInvoice = true
    const sale = payload?.sale || {}
    document.title = sale.number || sale.invoiceNumber || sale.invoice_no || sale.id || 'Sales Invoice'
    const branch = payload?.branch || {}
    const items = sale.items || []
    const subtotal = Number(sale.subtotal ?? items.reduce((sum, i) => sum + (Number(i.lineTotal || i.total || (Number(i.qty || 0) * Number(i.price || i.rate || 0))) || 0), 0))
    const taxtotal = Number(sale.taxTotal ?? sale.tax_total ?? 0)
    const total = Number(sale.total ?? subtotal + taxtotal)
    const taxPercent = sale.taxPercent ?? sale.tax_percent ?? (subtotal ? Math.round((taxtotal / subtotal) * 100) : 0)
    const pages = paginateItems(items, 16)
    const discountAmount = Number(sale.discount ?? sale.discount_amount ?? sale.discount_amt ?? 0)
    const discountPercent = subtotal && discountAmount ? Math.round((discountAmount / subtotal) * 100) : 0
    const allPages = pages.map((pageItems, pageIndex) => ({
      pageItems,
      pageIndex,
      totalPages: pages.length,
    }))

    const totals = {
      subtotal,
      taxTotal: taxtotal,
      total,
      discountAmount,
      discountPercent,
      taxLabel: `${taxPercent}% GST`,
      totalInWords: String(sale.totalInWords || '').toUpperCase(),
    }

    document.getElementById('invoicePages').innerHTML = allPages.map((page) => {
      return renderPage(page.pageIndex, page.totalPages, page.pageItems, sale, branch, totals, page.copyLabel)
    }).join('')
    setTimeout(() => { window.print() }, 500)
  }

  window.addEventListener('message', (ev) => {
    const msg = ev.data || {}
    if (msg.type !== 'renderInvoice') return
    renderInvoicePayload(normalizeInvoicePayload(msg.payload))
  })

  function setStatusMessage(message) {
    const container = document.getElementById('invoicePages')
    if (!container) return
    container.innerHTML = `<div style="padding:40px; text-align:center; color:#555; font-size:14px;">${message}</div>`
  }

  const queryParams = new URLSearchParams(window.location.search)
  const hasStandaloneInvoiceQuery = Boolean(queryParams.get('invoice_id') || queryParams.get('invoiceId'))
  if (!hasStandaloneInvoiceQuery) {
    setTimeout(() => {
      if (!hasRenderedInvoice) setStatusMessage('Failed to load invoice data.')
    }, 4000)
  }

  function getAuthHeaders() {
    const headers = { Accept: 'application/json' }
    try {
      const token = window.localStorage.getItem('retailos_token')
      if (token) headers.Authorization = `Bearer ${token}`
    } catch (e) {
      // ignore localStorage errors
    }
    return headers
  }

  async function tryLoadInvoiceFromQuery() {
    const params = new URLSearchParams(window.location.search)
    const invoiceId = params.get('invoice_id') || params.get('invoiceId')
    if (!invoiceId) return

    setStatusMessage('Loading invoice…')
    try {
      const response = await fetch(`/api/v1/sales/${encodeURIComponent(invoiceId)}`, {
        headers: getAuthHeaders(),
      })
      if (!response.ok) {
        console.error('Invoice fetch failed', response.status, response.statusText)
        setStatusMessage('Unable to load invoice. Please refresh or sign in again.')
        return
      }
      const sale = await response.json()
      if (!sale || !sale.id) {
        setStatusMessage('Invoice data is invalid or missing.')
        return
      }
      renderInvoicePayload(normalizeInvoicePayload({ sale, branch: {} }))
    } catch (err) {
      console.error('Failed to load invoice from query:', err)
      setStatusMessage('Unable to load invoice. Check your network connection.')
    }
  }

  tryLoadInvoiceFromQuery()
})();
</script>

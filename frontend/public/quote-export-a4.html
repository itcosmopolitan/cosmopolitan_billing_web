<body>
<div id="quotePages"></div>
<script>
(function() {
  function escapeHtml(str) {
    if (str === null || str === undefined) return ''
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
  }

  function formatDate(dateString) {
    if (!dateString) return ''
    const d = new Date(dateString)
    if (Number.isNaN(d.getTime())) return dateString
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
  }

  function formatNumber(value) {
    const n = Number(value)
    if (Number.isNaN(n)) return '0.00'
    return n.toLocaleString('en-MV', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
  }

  function amountToWords(value, invalidFallback = 'ZERO RUFIYAA AND ZERO LAARI ONLY') {
    const number = Number(value ?? 0)
    if (Number.isNaN(number)) return invalidFallback

    const rupees = Math.floor(number)
    const laari = Math.round((number - rupees) * 100)
    const ones = [
      'ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN',
      'EIGHT', 'NINE', 'TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN',
      'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN',
      'NINETEEN',
    ]
    const tens = [
      '', '', 'TWENTY', 'THIRTY', 'FORTY',
      'FIFTY', 'SIXTY', 'SEVENTY', 'EIGHTY', 'NINETY',
    ]

    const chunk = (number) => {
      if (number < 20) return ones[number]
      if (number < 100) {
        return tens[Math.floor(number / 10)] +
          (number % 10 ? ` ${ones[number % 10]}` : '')
      }
      const remainder = number % 100
      return `${ones[Math.floor(number / 100)]} HUNDRED${
        remainder ? ` ${chunk(remainder)}` : ''
      }`
    }

    if (rupees === 0 && laari === 0) {
      return 'ZERO RUFIYAA AND ZERO LAARI ONLY'
    }

    const parts = []
    let remaining = rupees
    let scaleIndex = 0
    const scale = ['', 'THOUSAND', 'MILLION', 'BILLION']

    while (remaining > 0) {
      const part = remaining % 1000
      if (part > 0) {
        parts.unshift(
          `${chunk(part)}${scale[scaleIndex] ? ` ${scale[scaleIndex]}` : ''}`
        )
      }
      remaining = Math.floor(remaining / 1000)
      scaleIndex += 1
    }

    return `${parts.join(' ') || 'ZERO'} RUFIYAA AND ${
      laari === 0 ? 'ZERO' : chunk(laari)
    } LAARI ONLY`
  }

  function formatYesNo(value) {
    return value ? 'Yes' : 'No'
  }

  function roundNumber(n) {
    return Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100
  }

  function quoteLineDiscountPct(line) {
    return Math.min(100, Math.max(0, Number(line.discount || line.line_discount || line.discPercent || 0)))
  }

  function quoteLineAmount(line) {
    const qty = Number(line.qty || 0)
    const price = Number(line.price || 0)
    const discountPct = quoteLineDiscountPct(line)
    const gross = roundNumber(qty * price)
    const fromDisc = roundNumber(gross * (1 - discountPct / 100))
    const stored = Number(line.lineTotal ?? line.total ?? 0)
    if (discountPct > 0) return fromDisc
    if (stored > 0) return roundNumber(stored)
    return fromDisc
  }

  function exclusiveFromInclusive(inclusive, taxRate) {
    const amount = Number(inclusive) || 0
    const rate = Number(taxRate) || 0
    if (amount <= 0) return 0
    if (rate <= 0) return roundNumber(amount)
    return roundNumber((amount * 100) / (100 + rate))
  }

  function quoteLineVatAmount(line, _pricesIncludingVat) {
    const amount = quoteLineAmount(line)
    const rate = Number(line.taxRate || line.tax_rate || 0)
    if (!rate || amount <= 0) return 0
    return roundNumber(amount * rate / (100 + rate))
  }

  function quoteLineTaxable(line) {
    return roundNumber(quoteLineAmount(line) - quoteLineVatAmount(line))
  }

  function quoteExclusiveRate(line) {
    return exclusiveFromInclusive(Number(line.price || 0), Number(line.taxRate || line.tax_rate || 0))
  }

  function groupVatRows(items, pricesIncludingVat) {
    const groups = {}
    items.forEach((line) => {
      const key = `${line.vatIdentifier || line.vat_identifier || 'GST'}|${Number(line.taxRate || line.tax_rate || 0)}`
      if (!groups[key]) {
        groups[key] = {
          vatIdentifier: line.vatIdentifier || line.vat_identifier || 'GST',
          taxRate: Number(line.taxRate || line.tax_rate || 0),
          lineAmount: 0,
          invoiceDiscountBase: 0,
          vatBase: 0,
          vatAmount: 0,
        }
      }
      const amount = quoteLineAmount(line)
      const taxAmount = quoteLineVatAmount(line, pricesIncludingVat)
      const taxable = roundNumber(amount - taxAmount)
      groups[key].lineAmount += amount
      groups[key].invoiceDiscountBase += taxable
      groups[key].vatBase += taxable
      groups[key].vatAmount += taxAmount
    })
    return Object.values(groups)
  }

  function renderPage(pageIndex, totalPages, pageItems, quote, branch, totals, copyLabel) {
    const hasValue = (value) => value != null && String(value).trim() !== ''
    const branchStreet2 = branch.street2 || branch.street_2 || 'LOT NO-10627, Haivakaru Magu'
    const branchStreet3 = branch.street3 || branch.street_3 || "Hulhumale'"
    const branchCountry = branch.country || branch.country_name || branch.countryName || 'Republic of Maldives'
    const branchPhone = branch.phone || branch.tel || branch.phoneNo || branch.phone_no || ''
    const phoneParts = String(branchPhone).match(/tel\s*:\s*(.*?)\s*(?:m\s*:\s*(.*))?$/i)
    const branchTel = phoneParts?.[1] || branchPhone
    const branchFax = branch.fax || branch.faxNo || branch.fax_no || phoneParts?.[2] || ''
    const branchTin = branch.gstRegNo || branch.gstin || branch.gst || branch.gstNo || branch.gst_no || ''
    const customerPhone = quote.customerPhone || quote.customer_phone || ''
    const rawAddress = quote.customerAddress || quote.customer_address || quote.address || quote.shippingAddress || quote.address_lines || quote.addressLines || ''
    const addressParts = [
      quote.customerStreet1 || quote.customer_street1,
      quote.customerStreet2 || quote.customer_street2,
      quote.customerStreet3 || quote.customer_street3,
      quote.customerCity || quote.customer_city || quote.city,
      quote.customerStateProvince || quote.customer_state_province,
      quote.customerCountry || quote.customer_country || quote.country,
      quote.customerPostalCode || quote.customer_postal_code || quote.postal_code,
    ].filter((part) => typeof part === 'string' && part.trim()).map((part) => part.trim())
    const customerAddress = (rawAddress ? (Array.isArray(rawAddress) ? rawAddress.filter(Boolean).join(', ') : rawAddress) : addressParts.join(', ')).toString().trim()
    const customerCode = quote.customerCode || quote.customer_code || ''
    const customerGstin = quote.customerGstin || quote.customer_gstin || quote.gstin || quote.gstNo || quote.gst_no || ''
    const quoteNumber = quote.number || quote.quote_no || ''
    const quoteDate = quote.date || quote.quote_date || ''
    const customerName = (quote.customerName || quote.customer_name || quote.customer || quote.name || '').toString().trim()
    const isWalkIn = customerName.toLowerCase() === 'walkin' || customerName.toLowerCase() === 'walk-in' || customerName.toLowerCase() === 'walk in' || customerName.toLowerCase() === 'walkin customer' || customerName.toLowerCase() === 'cash customer'
    const salesperson = quote.salesperson || quote.createdBy || quote.created_by || quote.customerKeyAccountManagerName || quote.customer_key_account_manager_name || quote.customerKeyAccountManager || quote.customer_key_account_manager || ''
    const paymentTerms = quote.paymentTerms || quote.payment_terms || quote.creditTerms || quote.credit_terms || ''
    const displayPaymentTerms = /^\d+(?:\.\d+)?$/.test(String(paymentTerms).trim()) ? `${String(paymentTerms).trim()} days` : paymentTerms
    const shipmentMethod = quote.shipmentMethod || quote.shipment_method || ''
    const pricesIncludingVat = quote.pricesIncludingVat || quote.prices_including_vat || false
    const paymentDiscountOnVat = Number(quote.paymentDiscountOnVat ?? quote.payment_discount_on_vat ?? 0)
    const customerRemarks = quote.notes || quote.remark || quote.remarks || ''

    return `
      <div class="page${pageIndex > 0 ? ' continuation-page' : ''}">
        <div class="header">
          <div style="display:flex; align-items:flex-start;">
            <div class="logo-block">
              <img class="logo-img" src="${escapeHtml(branch.logo || branch.logo_url || '/assets/cosmopolitan-logo.png')}" alt="Cosmopolitan" />
              <div class="logo-tag">"where quality and service matters"</div>
            </div>
          </div>
          <div class="company-info">
            <div class="company-name">${escapeHtml('C.Shop Champa Brothers Maldives Pvt Ltd')}</div>
            <div class="company-line">${escapeHtml(`${branchStreet2}, ${branchStreet3}, ${branchCountry}`)}</div>
            <div class="company-line">${escapeHtml(`T : 960 ${branchTel}, M : 960 ${branchFax}  W : www.cosmopolitan.com.mv`)}</div>
            <div class="company-line company-tin">${escapeHtml(`E : info@cosmopolitan.com.mv, TIN : ${branchTin}`)}</div>
          </div>
          <div class="gold-badge">
            ${branch.badge || branch.badge_url || branch.badgeImage || branch.badgeUrl ? `<img class="badge-img" src="${escapeHtml(branch.badge || branch.badge_url || branch.badgeImage || branch.badgeUrl)}" alt="Badge" />` : `
                <img id="goldSealImg" class="badge-img" src="/assets/gold-100-seal.png" alt="Gold 100 seal" onerror="this.style.display='none';document.getElementById('goldSealFallback').style.display='block'" />
                <div id="goldSealFallback" class="gold-seal" role="img" aria-label="Gold 100 seal" style="display:none;">
                  <div class="gold-corporate">Corporate Maldives</div>
                  <div class="gold-text">GOLD</div>
                  <div class="gold-100">100</div>
                  <div class="gold-year">2023</div>
                </div>
            `}
          </div>
        </div>

        <div class="title-row">
          ${copyLabel ? `<div class="copy-label">${escapeHtml(copyLabel)}</div>` : ''}
          <h1 class='center'>Quote</h1>
          <div class="pageno">Page ${pageIndex + 1} of ${totalPages}</div>
        </div>

        <div class="parties">
          <div class="bill-to details-box">
            <div class="details-title">Customer Details</div>
            <h2 style="margin:0 0 6px 0;">${escapeHtml(customerName)}</h2>
            ${hasValue(customerPhone) ? `<div class="addr-line">${escapeHtml(customerPhone)}</div>` : ''}
            <table style="margin-top:4px; width:100%;">
              ${hasValue(customerCode) && !isWalkIn ? `<tr><td class="label">Customer No.</td><td>${escapeHtml(customerCode)}</td></tr>` : ''}
              ${hasValue(customerGstin) ? `<tr><td class="label">GST Number</td><td>${escapeHtml(customerGstin)}</td></tr>` : ''}
              ${hasValue(quoteNumber) ? `<tr><td class="label">Quote No.</td><td>${escapeHtml(quoteNumber)}</td></tr>` : ''}
              ${hasValue(customerAddress) ? `<tr><td class="label">Address</td><td>${escapeHtml(customerAddress).replace(/\n/g, '<br/>')}</td></tr>` : ''}
            </table>
          </div>
          <div class="seller-addr details-box">
            <table style="width:100%;">
              ${hasValue(quoteDate) ? `<tr><td class="label">Quote Date</td><td>${escapeHtml(formatDate(quoteDate))}</td></tr>` : ''}
              ${hasValue(quoteNumber) ? `<tr><td class="label">Quotation No.</td><td>${escapeHtml(quoteNumber)}</td></tr>` : ''}
              ${hasValue(salesperson) ? `<tr><td class="label">Sales Person</td><td>${escapeHtml(salesperson)}</td></tr>` : ''}
            </table>
          </div>
        </div>

        <table class="items">
          <thead>
            <tr>
              <th>S.No</th>
              <th>Description</th>
              <th>Packing</th>
              <th>Units</th>
              <th class="num">Qty</th>
              <th class="num">Rate (Excl. GST)</th>
              <th class="num">Disc %</th>
              <th class="num">GST</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody>
            ${pageItems.map((line, lineIndex) => `
              <tr>
                <td>${pageIndex * 28 + lineIndex + 1}</td>
                <td>${escapeHtml(line.name || '')}</td>
                <td>${escapeHtml(line.packing ?? '')}</td>
                <td>${escapeHtml(line.unit || line.units || '')}</td>
                <td class="num">${escapeHtml(Number(line.qty || 0).toLocaleString('en-MV'))}</td>
                <td class="num">${formatNumber(quoteExclusiveRate(line))}</td>
                <td class="num">${quoteLineDiscountPct(line) ? `${formatNumber(quoteLineDiscountPct(line), { minimumFractionDigits: 0, maximumFractionDigits: 2 })}%` : ''}</td>
                <td class="num">${formatNumber(quoteLineVatAmount(line, pricesIncludingVat))}</td>
                <td class="num">${formatNumber(quoteLineTaxable(line))}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        ${pageIndex === totalPages - 1 ? `
        <table class="totals">
          <tr><td colspan="5"></td><td class="tlabel">Subtotal</td><td class="tval">${formatNumber(totals.subtotal)}</td></tr>
          <tr><td colspan="5"></td><td class="tlabel">${escapeHtml(totals.taxLabel)}</td><td class="tval">${formatNumber(totals.taxTotal)}</td></tr>
          ${paymentDiscountOnVat > 0 ? `<tr><td colspan="5"></td><td class="tlabel">Payment Discount on GST</td><td class="tval">${formatNumber(paymentDiscountOnVat)}</td></tr>` : ''}
          <tr class="grand-row"><td colspan="5"></td><td class="tlabel grand">Total Payable (Inc. GST)</td><td class="tval grand">${formatNumber(totals.total)}</td></tr>
        </table>
        ${totals.discountAmount > 0 ? `<div class="discount-note">Discount Amount: ${formatNumber(totals.discountAmount)}</div>` : ''}
        <div class="amount-words">${escapeHtml(amountToWords(totals.total))}</div>
        <div class="payment-section">
          <div class="bank-details">
            Bank Details : BMLMVR | Account Number : 7730000271249 | Account Name : COSMOPOLITAN CHAMPA BROTHERS PVT LTD | VIBER : 7384977
          </div>
        </div>
        <div class="terms">
          Disclaimer: Jurisdiction Male, Republic of Maldives, Supplier can not take any responsibility for product lost or spoil in transit after the delivery point. No return accepted, Overdue outstanding will be subjected to 1% interest per overdue day
        </div>
        <div class="thankyou">Thank you for choosing Cosmopolitan as your preferred partner</div>
        <div class="signoff">
          <div>Received By</div>
        </div>
        ` : ''}
      </div>
    `
  }

  function paginateItems(items, rowsPerPage) {
    const pages = []
    for (let i = 0; i < items.length; i += rowsPerPage) {
      pages.push(items.slice(i, i + rowsPerPage))
    }
    return pages
  }

  let hasRenderedQuote = false

  function renderQuotePayload(payload) {
    if (hasRenderedQuote) return
    hasRenderedQuote = true
    const quote = payload?.quote || {}
    const isPreview = new URLSearchParams(window.location.search).get('preview') === '1'
    if (isPreview) document.body.classList.add('invoice-preview')
    document.title = `Quote ${quote.number || quote.quote_no || quote.id || ''}`.trim()
    const branch = {
      ...payload?.branch,
      gstin: payload?.branch?.gstin || payload?.branch?.gst || payload?.branch?.gstNo || payload?.branch?.gst_no || '',
      email: payload?.branch?.email || payload?.branch?.emailAddress || payload?.branch?.email_address || '',
      website: payload?.branch?.website || payload?.branch?.homePage || payload?.branch?.homepage || payload?.branch?.url || '',
      homePage: payload?.branch?.homePage || payload?.branch?.homepage || payload?.branch?.website || payload?.branch?.url || '',
      phone: payload?.branch?.phone || payload?.branch?.phoneNo || payload?.branch?.phone_no || payload?.branch?.tel || '',
    }
    const items = quote.items || []
    // Recompute GST from discounted inclusive line totals (ignore stale taxTotal).
    let taxTotal = 0
    let taxable = 0
    let payable = 0
    items.forEach((line) => {
      const amount = quoteLineAmount(line)
      const tax = quoteLineVatAmount(line, true)
      taxTotal += tax
      taxable += roundNumber(amount - tax)
      payable += amount
    })
    taxTotal = roundNumber(taxTotal)
    const subtotal = roundNumber(taxable)
    const total = roundNumber(payable)
    const exclGross = roundNumber(items.reduce((sum, line) => {
      const qty = Number(line.qty || 0)
      return sum + qty * quoteExclusiveRate(line)
    }, 0))
    const discountAmount = roundNumber(Math.max(0, exclGross - subtotal))
    const taxPercent = quote.taxPercent ?? quote.tax_percent ?? (subtotal ? Math.round((taxTotal / subtotal) * 100) : 0)
    const pages = paginateItems(items, 28)
    const totals = {
      subtotal,
      taxTotal,
      total,
      discountAmount,
      taxLabel: `${taxPercent}% GST`,
    }
    const allPages = pages.map((pageItems, pageIndex) => ({
      pageItems,
      pageIndex,
      totalPages: pages.length,
      copyLabel: '',
    }))

    document.getElementById('quotePages').innerHTML = allPages.map((page) => renderPage(page.pageIndex, page.totalPages, page.pageItems, quote, branch, totals, page.copyLabel)).join('')
    setTimeout(() => {
      if (isPreview) {
        window.parent.postMessage({
          type: 'quoteRendered',
          height: document.documentElement.scrollHeight,
        }, window.location.origin)
      } else {
        window.print()
      }
    }, 500)
  }

  function setStatusMessage(message) {
    const container = document.getElementById('quotePages')
    if (!container) return
    container.innerHTML = `<div style="padding:40px; text-align:center; color:#555; font-size:14px;">${escapeHtml(message)}</div>`
  }

  function getAuthHeaders() {
    const headers = { Accept: 'application/json' }
    try {
      const token = window.localStorage.getItem('retailos_token')
      if (token) headers.Authorization = `Bearer ${token}`
    } catch (e) {}
    return headers
  }

  async function fetchBranchById(branchId) {
    if (!branchId) return {}
    try {
      const response = await fetch(`/api/v1/branches/${encodeURIComponent(branchId)}`, {
        headers: getAuthHeaders(),
      })
      if (response.ok) {
        return await response.json()
      }
    } catch (e) {
      // ignore branch load failure
    }
    return {}
  }

  async function tryLoadQuoteFromQuery() {
    if (window.opener) return
    const params = new URLSearchParams(window.location.search)
    const quoteId = params.get('quote_id') || params.get('quoteId')
    if (!quoteId) return
    setStatusMessage('Loading quotation…')
    try {
      const response = await fetch(`/api/v1/sales/quotations/${encodeURIComponent(quoteId)}`, {
        headers: getAuthHeaders(),
      })
      if (!response.ok) {
        setStatusMessage('Unable to load quotation. Please refresh or sign in again.')
        return
      }
      const quote = await response.json()
      if (!quote || !quote.id) {
        setStatusMessage('Quotation data is invalid or missing.')
        return
      }
      const branchId = quote.branchId || quote.branch_id
      const branch = branchId ? await fetchBranchById(branchId) : {}
      renderQuotePayload({ quote, branch })
    } catch (err) {
      setStatusMessage('Unable to load quotation. Check your network connection.')
    }
  }

  window.addEventListener('message', async (ev) => {
    const msg = ev.data || {}
    if (msg.type !== 'renderQuote') return
    const payload = msg.payload || {}
    const quote = payload.quote || {}
    let branch = payload.branch || {}
    const branchId = branch.id || quote.branchId || quote.branch_id
    const needsBranchLoad = branchId && (!branch.phone || !branch.email || !branch.website || !branch.gstin)
    if (needsBranchLoad) {
      branch = { ...branch, ...(await fetchBranchById(branchId)) }
    }
    renderQuotePayload({ quote, branch })
  })

  tryLoadQuoteFromQuery()
})();
</script>
</body>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test Activity - GRN</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --green: #16a34a; --green-bg:#ecfdf5;
      --blue:#0ea5e9; --blue-bg:#eff6ff;
      --purple:#7c3aed; --purple-bg:#f5f3ff;
      --amber:#d97706; --amber-bg:#fff7ed;
      --red:#ef4444; --red-bg:#fff1f2;
      --bg-strong:#0b1220; --border-default:#222;
      --text-primary:#ffffff; --text-muted:#9aa6b2; --text-secondary:#cbd5e1;
      --accent:#10b981; --bg-hover:#0f1724;
    }
    body{background:#061224;color:var(--text-primary);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:24px}
    .drawer{width:720px;background:linear-gradient(180deg,#07122a 0%, #031322 100%);padding:20px;border-radius:12px}
    .card{padding:16px;border-radius:12px;border:1px solid var(--border-default);background:var(--bg-strong);display:flex;gap:12px}
    .circle{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-primary);flex-shrink:0}
    .avatar{width:38px;height:38px;border-radius:6px;background:#0ea5e9;display:flex;align-items:center;justify-content:center;font-weight:700}
    .body{flex:1}
    .title{font-size:14px;font-weight:600;white-space:pre-wrap}
    .meta{font-size:12px;color:var(--text-muted);margin-top:6px}
    .tag{padding:4px 8px;border-radius:999px;font-size:12px}
  </style>
</head>
<body>
  <h2>GRN - Quantity Received (should be AMBER)</h2>
  <div class="drawer">
    <div class="card" style="align-items:flex-start;flex-direction:column;gap:12px">
      <div style="display:flex;gap:12px;width:100%">
        <div class="circle" style="background:var(--amber-bg);color:var(--amber);border:1px solid rgba(217,119,6,0.27)">✎</div>
        <div class="avatar">HM</div>
        <div class="body">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="title">Quantity received: 10 units were recorded</div>
            <div><span class="tag" style="background:var(--amber-bg);color:var(--amber)">Quantity received</span></div>
          </div>
          <div class="meta">By Harish · 2026-06-21 10:12</div>
          <div style="margin-top:8px"><span class="tag" style="background:var(--accent);color:#001">GRN</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
